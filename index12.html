
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #283b63);
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      background: #182235;
      border: 1px solid #34445f;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      color: white;
      font-size: 25px;
      text-align: center;
      margin-bottom: 20px;
    }

    .display {
      min-height: 110px;
      padding: 15px;
      margin-bottom: 20px;
      background: #0d1524;
      border-radius: 14px;
      text-align: right;
      overflow: hidden;
    }

    .previous {
      min-height: 24px;
      color: #91a4c4;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #screen {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 36px;
      text-align: right;
    }

    .error {
      min-height: 16px;
      color: #ff7777;
      font-size: 12px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-width: 0;
      height: 58px;
      border: none;
      border-radius: 13px;
      background: #293750;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      touch-action: manipulation;
    }

    button:hover {
      background: #3a4b68;
    }

    button:active {
      transform: scale(0.95);
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 2px;
    }

    .utility {
      background: #45536b;
    }

    .operator {
      background: #375cc9;
    }

    .operator:hover {
      background: #4a70e5;
    }

    .equals {
      grid-row: span 2;
      height: auto;
      background: #16a085;
    }

    .equals:hover {
      background: #1abc9c;
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      margin-top: 20px;
      color: #91a4c4;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 400px) {
      .calculator {
        padding: 18px;
      }

      .buttons {
        gap: 8px;
      }

      button {
        height: 54px;
        font-size: 19px;
      }

      .equals {
        height: auto;
      }

      #screen {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="calculator">
    <h1>Calculator</h1>

    <div class="display" aria-live="polite">
      <div id="previous" class="previous"></div>
      <input id="screen" type="text" value="0"
        aria-label="Calculator display" readonly>
      <p id="error" class="error" role="alert"></p>
    </div>

    <div class="buttons">
      <button class="utility" data-action="clear">C</button>
      <button class="utility" data-action="backspace">⌫</button>
      <button class="operator" data-operator="÷">÷</button>
      <button class="operator" data-operator="×">×</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="−">−</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="+">+</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-number="0">0</button>
      <button data-action="decimal">.</button>
    </div>

    <p class="footer">Simple • Smart • Stylish</p>
  </main>

  <script>
    const screen = document.getElementById("screen");
    const previous = document.getElementById("previous");
    const error = document.getElementById("error");
    const buttons = document.querySelector(".buttons");

    let currentValue = "0";
    let storedValue = null;
    let operator = null;
    let waitingForOperand = false;
    let justCalculated = false;

    function updateDisplay() {
      screen.value = currentValue;

      if (!justCalculated) {
        previous.textContent =
          storedValue !== null && operator
            ? `${storedValue} ${operator}`
            : "";
      }

      error.textContent = "";
    }

    function clearCalculator() {
      currentValue = "0";
      storedValue = null;
      operator = null;
      waitingForOperand = false;
      justCalculated = false;
      updateDisplay();
    }

    function inputNumber(number) {
      if (currentValue === "Error") clearCalculator();

      if (waitingForOperand || justCalculated) {
        currentValue = number;
        waitingForOperand = false;
        justCalculated = false;
      } else if (currentValue === "0") {
        currentValue = number;
      } else if (currentValue.length < 15) {
        currentValue += number;
      }

      updateDisplay();
    }

    function inputDecimal() {
      if (currentValue === "Error") clearCalculator();

      if (waitingForOperand || justCalculated) {
        currentValue = "0.";
        waitingForOperand = false;
        justCalculated = false;
      } else if (!currentValue.includes(".")) {
        currentValue += ".";
      }

      updateDisplay();
    }

    function calculate(a, b, op) {
      switch (op) {
        case "+":
          return a + b;
        case "−":
          return a - b;
        case "×":
          return a * b;
        case "÷":
          if (b === 0) {
            throw new Error("Cannot divide by zero!");
          }
          return a / b;
        default:
          return b;
      }
    }

    function formatResult(number) {
      if (!Number.isFinite(number)) {
        throw new Error("Result is out of range!");
      }

      return String(Number(number.toPrecision(12)));
    }

    function chooseOperator(nextOperator) {
      if (currentValue === "Error") return;

      const inputValue = Number(currentValue);

      if (operator && !waitingForOperand) {
        try {
          currentValue = formatResult(
            calculate(storedValue, inputValue, operator)
          );
        } catch (err) {
          currentValue = "Error";
          storedValue = null;
          operator = null;
          waitingForOperand = true;
          updateDisplay();
          error.textContent = err.message;
          return;
        }
      } else if (storedValue === null || !operator) {
        storedValue = inputValue;
      }

      operator = nextOperator;
      waitingForOperand = true;
      justCalculated = false;
      updateDisplay();
    }

    function calculateResult() {
      if (operator === null || storedValue === null) return;
      if (currentValue === "Error") return;

      const first = storedValue;
      const second = Number(currentValue);
      const op = operator;

      try {
        const result = formatResult(calculate(first, second, op));

        currentValue = result;
        previous.textContent = `${first} ${op} ${second} =`;
        storedValue = null;
        operator = null;
        waitingForOperand = true;
        justCalculated = true;
        screen.value = currentValue;
        error.textContent = "";
      } catch (err) {
        currentValue = "Error";
        storedValue = null;
        operator = null;
        waitingForOperand = true;
        justCalculated = false;
        previous.textContent = "";
        screen.value = currentValue;
        error.textContent = err.message;
      }
    }

    function backspace() {
      if (currentValue === "Error") {
        clearCalculator();
        return;
      }

      if (waitingForOperand || justCalculated) return;

      currentValue = currentValue.length > 1
        ? currentValue.slice(0, -1)
        : "0";

      if (currentValue === "-") currentValue = "0";

      updateDisplay();
    }

    buttons.addEventListener("click", function(event) {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.number !== undefined) {
        inputNumber(button.dataset.number);
        return;
      }

      if (button.dataset.operator) {
        chooseOperator(button.dataset.operator);
        return;
      }

      switch (button.dataset.action) {
        case "clear":
          clearCalculator();
          break;
        case "backspace":
          backspace();
          break;
        case "decimal":
          inputDecimal();
          break;
        case "equals":
          calculateResult();
          break;
      }
    });

    document.addEventListener("keydown", function(event) {
      const key = event.key;

      if (/^[0-9]$/.test(key)) {
        inputNumber(key);
      } else if (key === ".") {
        inputDecimal();
      } else if (key === "+") {
        chooseOperator("+");
      } else if (key === "-") {
        chooseOperator("−");
      } else if (key === "*") {
        chooseOperator("×");
      } else if (key === "/") {
        event.preventDefault();
        chooseOperator("÷");
      } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculateResult();
      } else if (key === "Backspace") {
        backspace();
      } else if (key === "Escape" || key === "Delete") {
        clearCalculator();
      }
    });

    updateDisplay();
  </script>

</body>
</html>
